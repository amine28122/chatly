<!doctype html>
<html lang="en" dir="ltr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        // Prevent and handle getter-only fetch property errors gracefully
        try {
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch') || Object.getOwnPropertyDescriptor(Object.getPrototypeOf(window), 'fetch');
          if (desc && !desc.writable && !desc.set) {
            var currentFetch = window.fetch.bind(window);
            Object.defineProperty(window, 'fetch', {
              get: function() { return currentFetch; },
              set: function(fn) { currentFetch = fn; },
              configurable: true,
              enumerable: true
            });
          }
        } catch (err) {
          // Fallback if property is sealed/frozen
        }

        window.addEventListener('error', function(e) {
          if (e && e.message && (e.message.indexOf('fetch') !== -1 || e.message.indexOf('Cannot set property') !== -1)) {
            e.preventDefault && e.preventDefault();
            e.stopImmediatePropagation && e.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BotCraft AI | Luxury AI Chatbots & Website Widgets</title>

  </body>
</html>
